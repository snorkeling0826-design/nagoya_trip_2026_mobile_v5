let state=defaultState(), currentDay=0, editing=null, manageEditing=null, copyFrom=null, remoteReady=false, saveTimer=null, suppressRemote=false, lastCloudUpdate=null;
function setSync(kind,text,time){const d=document.getElementById('syncDot');d.className='sync-dot '+(kind||'');document.getElementById('syncText').textContent=text;document.getElementById('syncTime').textContent=time||''}
function renderCloudNotice(){document.getElementById('cloudNotice').innerHTML='<h2>☁️ 多人共享</h2><p class="sub">這份旅行資料儲存在 Supabase 雲端；同一個 APP 網址開在不同手機，修改會自動同步。</p><div class="code">共享旅行：Nagoya Trip 2026<br>同步模式：即時 Realtime</div><p class="small">目前版本採「知道 APP 網址即可共同編輯」模式，適合旅伴共同規劃。不要把 APP 網址公開到不認識的人群組。</p>'}
function normalizeState(x){const d=defaultState();if(!x||typeof x!=='object')return d;return {itinerary:Array.isArray(x.itinerary)?x.itinerary:d.itinerary,transport:Array.isArray(x.transport)?x.transport:d.transport,tickets:Array.isArray(x.tickets)?x.tickets:d.tickets,buy:Array.isArray(x.buy)?x.buy:d.buy,eat:Array.isArray(x.eat)?x.eat:d.eat,pack:Array.isArray(x.pack)?x.pack:d.pack}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');if(x)return normalizeState(x)}catch(e){}return null}
function cache(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}catch(e){}}
async function loadCloud(){setSync('warn','正在連線到雲端…','讀取旅行資料');try{const row=await apiRead();if(row&&row.data&&Object.keys(row.data).length){state=normalizeState(row.data);cache();lastCloudUpdate=row.updated_at;remoteReady=true;setSync('ok','已連線・多人同步中',fmtTime(row.updated_at));renderAll()}else{state=loadLocal()||defaultState();cache();const written=await apiWrite();lastCloudUpdate=written?.updated_at||new Date().toISOString();remoteReady=true;setSync('ok','已建立共享旅行',fmtTime(lastCloudUpdate));renderAll()}}catch(e){console.error(e);remoteReady=false;setSync('err','雲端讀取失敗',e.message||'請檢查 Supabase 權限設定');state=loadLocal()||defaultState();renderAll()}}
function fmtTime(x){if(!x)return '';const d=new Date(x);return '最後同步 '+d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
async function writeCloud(initial=false){cache();suppressRemote=true;try{const row=await apiWrite();lastCloudUpdate=row?.updated_at||new Date().toISOString();setSync('ok',initial?'已建立共享旅行':'已同步',fmtTime(lastCloudUpdate));return true}catch(e){console.error(e);setSync('err','同步失敗',e.message||'請檢查網路或 Supabase 權限');return false}finally{suppressRemote=false}}
function scheduleSave(){cache();if(!remoteReady)return;clearTimeout(saveTimer);setSync('warn','等待同步…','');saveTimer=setTimeout(()=>writeCloud(false),350)}
async function forceSync(){await loadCloud()}
async function pollCloud(){if(!remoteReady||suppressRemote)return;try{const row=await apiRead();if(row?.updated_at&&row.updated_at!==lastCloudUpdate&&row.data){state=normalizeState(row.data);cache();lastCloudUpdate=row.updated_at;renderAll();setSync('ok','已收到其他裝置更新',fmtTime(lastCloudUpdate))}}catch(e){console.warn('poll',e)}}
setInterval(pollCloud,5000)
function renderItinerary(){const tabs=document.getElementById('tabs'),content=document.getElementById('content');tabs.innerHTML='';content.innerHTML='';state.itinerary.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[0];b.type='button';b.className=i===currentDay?'on':'';b.onclick=()=>{currentDay=i;renderItinerary()};tabs.appendChild(b);if(i!==currentDay)return;const s=document.createElement('div');s.innerHTML='<div class="card hero"><h2>'+esc(d[1])+'</h2><p>'+esc(d[2])+'</p><div class="day-actions"><button class="btn secondary" onclick="editDay('+i+')">✏️ 修改今日標題</button><button class="btn secondary" onclick="addItem('+i+')">＋ 新增行程</button><button class="btn secondary" onclick="openCopy('+i+')">📋 複製整天</button></div><div class="notice">↕️ 電腦可拖曳排序；手機用 ↑↓。修改後會自動同步。</div></div>';const list=document.createElement('div');d[3].forEach((it,j)=>{const card=document.createElement('div');card.className='manage-card item-card';card.draggable=true;card.dataset.index=j;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',j);card.classList.add('dragging')});card.addEventListener('dragend',()=>card.classList.remove('dragging'));card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();moveItem(i,Number(e.dataTransfer.getData('text/plain')),j)});card.innerHTML='<div class="manage-row"><span class="drag-mini">↕️</span><div class="manage-body"><div class="manage-title">'+esc(it[1])+'</div><div class="manage-meta">'+esc(it[0])+'</div><div class="manage-note">'+esc(it[2])+'</div><div class="actions">'+(it[3]?'<button class="btn" onclick="openMap('+JSON.stringify(it[3])+')">📍 Google Maps</button>':'')+'<button class="btn secondary" onclick="moveItem('+i+','+j+','+(j-1)+')">↑ 上移</button><button class="btn secondary" onclick="moveItem('+i+','+j+','+(j+1)+')">↓ 下移</button><button class="btn secondary" onclick="editItem('+i+','+j+')">✏️ 修改</button><button class="btn danger" onclick="deleteItem('+i+','+j+')">🗑️ 刪除</button></div></div></div>';list.appendChild(card)});s.appendChild(list);content.appendChild(s)})}
function moveItem(day,from,to){const a=state.itinerary[day][3];if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;const x=a.splice(from,1)[0];a.splice(to,0,x);scheduleSave();renderItinerary()}
function addItem(day){editing={day,index:null};document.getElementById('itemModalTitle').textContent='新增行程';['if1','if2','if3','if4'].forEach(id=>document.getElementById(id).value='');document.getElementById('itemModal').classList.add('on')}
function editItem(day,index){const x=state.itinerary[day][3][index];editing={day,index};document.getElementById('itemModalTitle').textContent='修改行程';document.getElementById('if1').value=x[0]||'';document.getElementById('if2').value=x[1]||'';document.getElementById('if3').value=x[2]||'';document.getElementById('if4').value=x[3]||'';document.getElementById('itemModal').classList.add('on')}
function closeItem(){document.getElementById('itemModal').classList.remove('on');editing=null}
function saveItem(){const a=[document.getElementById('if1').value.trim(),document.getElementById('if2').value.trim(),document.getElementById('if3').value.trim(),document.getElementById('if4').value.trim()];if(!a[1])return alert('請輸入標題');const arr=state.itinerary[editing.day][3];if(editing.index===null)arr.push(a);else arr[editing.index]=a;closeItem();scheduleSave();renderItinerary()}
function deleteItem(day,index){if(!confirm('確定要刪除這個行程嗎？'))return;state.itinerary[day][3].splice(index,1);scheduleSave();renderItinerary()}
function editDay(i){const d=state.itinerary[i];editing={day:i};document.getElementById('df1').value=d[0];document.getElementById('df2').value=d[1];document.getElementById('df3').value=d[2];document.getElementById('dayModal').classList.add('on')}
function closeDay(){document.getElementById('dayModal').classList.remove('on');editing=null}
function saveDay(){const d=state.itinerary[editing.day];d[0]=document.getElementById('df1').value.trim()||d[0];d[1]=document.getElementById('df2').value.trim()||d[1];d[2]=document.getElementById('df3').value.trim();closeDay();scheduleSave();renderItinerary()}
function openCopy(i){copyFrom=i;document.getElementById('copyFromText').textContent='來源：'+state.itinerary[i][0]+' '+state.itinerary[i][1];const el=document.getElementById('copyTargets');el.innerHTML='';state.itinerary.forEach((d,j)=>{if(j===i)return;const b=document.createElement('button');b.textContent=d[0]+'｜'+d[1];b.onclick=()=>{if(!confirm('要把 '+state.itinerary[i][0]+' 的完整行程覆蓋到 '+d[0]+' 嗎？'))return;state.itinerary[j]=clone(state.itinerary[i]);scheduleSave();closeCopy();currentDay=j;renderItinerary()};el.appendChild(b)});document.getElementById('copyModal').classList.add('on')}
function closeCopy(){document.getElementById('copyModal').classList.remove('on');copyFrom=null}
function renderManage(type){const arr=type==='transport'?state.transport:state.tickets,el=document.getElementById(type==='transport'?'transportList':'ticketList');el.innerHTML='';if(!arr.length){el.innerHTML='<div class="card muted">目前沒有項目。</div>';return}arr.forEach((x,i)=>{const card=document.createElement('div');card.className='manage-card';card.draggable=true;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',i);card.classList.add('dragging')});card.addEventListener('dragend',()=>card.classList.remove('dragging'));card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();moveManage(type,Number(e.dataTransfer.getData('text/plain')),i)});card.innerHTML='<div class="manage-row"><span class="drag-mini">↕️</span><div class="manage-body"><div class="manage-title">'+esc(x.t)+'</div><div class="manage-meta">'+esc(x.m)+'</div><div class="manage-note">'+esc(x.n)+'</div><div class="actions">'+(x.map?'<button class="btn" onclick="openMap('+JSON.stringify(x.map)+')">📍 Google Maps</button>':'')+'<button class="btn secondary" onclick="moveManage('+JSON.stringify(type)+','+i+','+(i-1)+')">↑ 上移</button><button class="btn secondary" onclick="moveManage('+JSON.stringify(type)+','+i+','+(i+1)+')">↓ 下移</button><button class="btn secondary" onclick="editManage('+JSON.stringify(type)+','+i+')">✏️ 修改</button><button class="btn danger" onclick="deleteManage('+JSON.stringify(type)+','+i+')">🗑️ 刪除</button></div></div></div>';el.appendChild(card)})}
function moveManage(type,from,to){const a=type==='transport'?state.transport:state.tickets;if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;const x=a.splice(from,1)[0];a.splice(to,0,x);scheduleSave();renderManage(type)}
function addManage(type){manageEditing={type,index:null};document.getElementById('manageModalTitle').textContent=type==='transport'?'新增交通':'新增票券';document.getElementById('mf1Label').textContent=type==='transport'?'交通名稱':'票券名稱';document.getElementById('mf2Label').textContent=type==='transport'?'時間／路線':'日期／使用時間';['mf1','mf2','mf3','mf4'].forEach(id=>document.getElementById(id).value='');document.getElementById('manageModal').classList.add('on')}
function editManage(type,index){const a=type==='transport'?state.transport:state.tickets,x=a[index];manageEditing={type,index};document.getElementById('manageModalTitle').textContent=type==='transport'?'修改交通':'修改票券';document.getElementById('mf1Label').textContent=type==='transport'?'交通名稱':'票券名稱';document.getElementById('mf2Label').textContent=type==='transport'?'時間／路線':'日期／使用時間';document.getElementById('mf1').value=x.t||'';document.getElementById('mf2').value=x.m||'';document.getElementById('mf3').value=x.n||'';document.getElementById('mf4').value=x.map||'';document.getElementById('manageModal').classList.add('on')}
function closeManage(){document.getElementById('manageModal').classList.remove('on');manageEditing=null}
function saveManage(){const x={t:document.getElementById('mf1').value.trim(),m:document.getElementById('mf2').value.trim(),n:document.getElementById('mf3').value.trim(),map:document.getElementById('mf4').value.trim()};if(!x.t)return alert('請輸入名稱');const a=manageEditing.type==='transport'?state.transport:state.tickets;if(manageEditing.index===null)a.push(x);else a[manageEditing.index]=x;const type=manageEditing.type;closeManage();scheduleSave();renderManage(type)}
function deleteManage(type,index){if(!confirm('確定要刪除這個項目嗎？'))return;(type==='transport'?state.transport:state.tickets).splice(index,1);scheduleSave();renderManage(type)}
function renderList(which,id){const a=state[which],el=document.getElementById(id);el.innerHTML='';if(!a.length){el.innerHTML='<p class="muted">目前沒有項目。</p>';return}a.forEach((x,i)=>{const card=document.createElement('div');card.className='manage-card';card.draggable=true;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',i);card.classList.add('dragging')});card.addEventListener('dragend',()=>card.classList.remove('dragging'));card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();moveList(which,Number(e.dataTransfer.getData('text/plain')),i)});card.innerHTML='<div class="manage-row"><span class="drag-mini">↕️</span><div class="manage-body"><label class="check-title"><input type="checkbox" '+(x.d?'checked':'')+' onchange="toggleList('+JSON.stringify(which)+','+i+',this.checked)"><span class="'+(x.d?'done':'')+'">'+esc(x.t)+'</span></label><div class="actions"><button class="btn secondary" onclick="moveList('+JSON.stringify(which)+','+i+','+(i-1)+')">↑ 上移</button><button class="btn secondary" onclick="moveList('+JSON.stringify(which)+','+i+','+(i+1)+')">↓ 下移</button><button class="btn secondary" onclick="editList('+JSON.stringify(which)+','+i+')">✏️ 修改</button><button class="btn danger" onclick="deleteList('+JSON.stringify(which)+','+i+')">🗑️ 刪除</button></div></div></div>';el.appendChild(card)})}
function moveList(which,from,to){const a=state[which];if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;const x=a.splice(from,1)[0];a.splice(to,0,x);scheduleSave();renderList(which,which)}
function toggleList(which,i,v){state[which][i].d=v;scheduleSave();renderList(which,which)}
function addList(which){const id=which==='buy'?'bi':'ei',v=document.getElementById(id).value.trim();if(!v)return;state[which].push({t:v,d:false});document.getElementById(id).value='';scheduleSave();renderList(which,which)}
function editList(which,i){const v=prompt('修改項目',state[which][i]?.t||'');if(v===null||!v.trim())return;state[which][i].t=v.trim();scheduleSave();renderList(which,which)}
function deleteList(which,i){if(!confirm('確定要刪除這個項目嗎？'))return;state[which].splice(i,1);scheduleSave();renderList(which,which)}
function renderPack(){const a=state.pack,el=document.getElementById('pack');el.innerHTML='';if(!a.length){el.innerHTML='<p class="muted">目前沒有行李項目。</p>';return}a.forEach((x,i)=>{const card=document.createElement('div');card.className='manage-card';card.draggable=true;card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',i);card.classList.add('dragging')});card.addEventListener('dragend',()=>card.classList.remove('dragging'));card.addEventListener('dragover',e=>e.preventDefault());card.addEventListener('drop',e=>{e.preventDefault();movePack(Number(e.dataTransfer.getData('text/plain')),i)});card.innerHTML='<div class="manage-row"><span class="drag-mini">↕️</span><div class="manage-body"><label class="check-title"><input type="checkbox" '+(x.d?'checked':'')+' onchange="togglePack('+i+',this.checked)"><span class="'+(x.d?'done':'')+'">'+esc(x.t)+'</span></label><div class="actions"><button class="btn secondary" onclick="movePack('+i+','+(i-1)+')">↑ 上移</button><button class="btn secondary" onclick="movePack('+i+','+(i+1)+')">↓ 下移</button><button class="btn secondary" onclick="editPack('+i+')">✏️ 修改</button><button class="btn danger" onclick="deletePack('+i+')">🗑️ 刪除</button></div></div></div>';el.appendChild(card)})}
function movePack(from,to){const a=state.pack;if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;const x=a.splice(from,1)[0];a.splice(to,0,x);scheduleSave();renderPack()}
function togglePack(i,v){state.pack[i].d=v;scheduleSave();renderPack()}
function addPack(){const v=prompt('新增行李項目');if(v===null||!v.trim())return;state.pack.push({t:v.trim(),d:false});scheduleSave();renderPack()}
function editPack(i){const v=prompt('修改行李項目',state.pack[i]?.t||'');if(v===null||!v.trim())return;state.pack[i].t=v.trim();scheduleSave();renderPack()}
function deletePack(i){if(!confirm('確定要刪除這個行李項目嗎？'))return;state.pack.splice(i,1);scheduleSave();renderPack()}

renderCloudNotice();renderAll();loadCloud();
</script>
